<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2CD37">
    <meta name="description" content="乐高零件管理系统">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>乐高零件管理系统</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="css/style.css?v=2026073109">
    
    <!-- 内联回退：确保RB_STORES始终可用，防止旧SW缓存导致变量丢失 -->
    <script>
    if (typeof RB_STORES === 'undefined') {
        window.RB_STORES = {
            COLORS: 'rb_colors',
            ELEMENTS: 'rb_elements',
            INVENTORY_PARTS: 'rb_inventory_parts',
            PART_CATEGORIES: 'rb_part_categories',
            PART_RELATIONSHIPS: 'rb_part_relationships',
            PARTS: 'rb_parts'
        };
    }
    if (typeof RB_STORE_KEYS === 'undefined') {
        window.RB_STORE_KEYS = {
            'rb_colors': 'colors',
            'rb_parts': 'parts',
            'rb_part_categories': 'part_categories',
            'rb_elements': 'elements',
            'rb_inventory_parts': 'inventory_parts',
            'rb_part_relationships': 'part_relationships'
        };
    }
    </script>
    
    <script src="js/api.js?v=2026073122"></script>
    <script src="js/store.js?v=2026073122"></script>
    <script src="js/rb-db.js?v=2026073122"></script>
    <script src="js/ui.js?v=2026073122"></script>
</head>
<body>
    <div class="container">
        <div class="aa-area">
            <div class="header-content">
                <div class="logo">
                    <img src="icons/LOGO.JPEG" alt="乐高零件管理系统">
                </div>
                <div class="title">
                    <h1>顺德乐高玩具专卖店-零件库</h1>
                </div>
            </div>
        </div>
        
        <div class="bb-area">
            <div class="nav">
                <button class="repo-btn active" onclick="switchTab('repositories', this)">仓库管理</button>
                <button class="part-btn" onclick="switchTab('parts', this)">零件管理</button>
                <button class="search-btn" onclick="switchTab('search', this)">零件搜索</button>
                <button class="settings-btn" onclick="switchTab('settings', this)">系统设置</button>
            </div>
        </div>
        
        <div class="cc-area">
            <div class="content">
                <div id="repositories-tab" class="tab-content active">
                    <div class="repository-management">
                        <div class="repository-header">
                            <div class="header-left">
                                <div class="header-title-row">
                                    <h2>仓库列表</h2>
                                    <div class="repository-stats">共 <span id="repository-count">0</span> 个仓库</div>
                                </div>
                            </div>
                            <button onclick="addRepository()" class="add-repository-btn">添加仓库</button>
                        </div>
                        <div class="repository-scroll">
                            <div class="repository-list" id="repositories-list"></div>
                        </div>
                    </div>
                    
                    <div class="box-management" id="box-management">
                        <div class="box-header">
                            <div class="box-header-left">
                                <h2 id="selected-repository-name">未命名仓库 - 盒子管理</h2>
                                <div class="box-stats">共 <span id="box-count">0</span> 个盒子</div>
                            </div>
                            <div class="box-management-buttons">
                                <button onclick="addBox()" class="add-box-btn">添加盒子</button>
                                <button onclick="alert('转仓功能开发中...')" class="transfer-box-btn">盒子转仓</button>
                            </div>
                        </div>
                        <div class="box-grid-wrapper">
                            <div class="box-grid" id="boxes-list"></div>
                        </div>
                    </div>
                    
                    <div class="no-repository-selected" id="no-repository-selected">
                        <p>请选择一个仓库查看盒子</p>
                    </div>
                </div>
                
                <div id="parts-tab" class="tab-content">
                    <div class="part-management-container">
                        <div class="part-header">
                            <h2 id="selected-box-name">未命名零件管理</h2>
                            <div class="part-stats">共 <span id="part-count">0</span> 种零件</div>
                        </div>
                        <div class="part-action-buttons">
                            <button onclick="goBackToRepositories()" class="action-btn">返回</button>
                            <button onclick="showCSVImporter()" class="action-btn">批量导入</button>
                            <button onclick="alert('转盒功能开发中...')" class="action-btn">零件转盒</button>
                            <button onclick="showAddPartSheet()" class="action-btn">添加零件</button>
                        </div>
                        <div class="part-grid-wrapper">
                            <div class="part-grid" id="parts-list"></div>
                        </div>
                        <div class="no-box-selected" id="no-box-selected">
                            <p>请选择一个盒子查看零件</p>
                        </div>
                    </div>
                </div>
                
                <div id="search-tab" class="tab-content search-tab">
                    <h2>零件搜索</h2>
                    <div class="search-filters">
                        <div class="filter-row">
                            <div class="filter-group">
                                <label>型号</label>
                                <input type="text" id="search-part-num" placeholder="零件型号">
                            </div>
                            <div class="filter-group">
                                <label>名称</label>
                                <input type="text" id="search-part-name" placeholder="零件名称">
                            </div>
                        </div>
                        <div class="filter-row">
                            <div class="filter-group">
                                <label>颜色ID</label>
                                <input type="number" id="search-color-id" placeholder="颜色ID">
                            </div>
                            <div class="filter-group">
                                <label>状态</label>
                                <select id="search-status">
                                    <option value="">全部</option>
                                    <option value="true">新品</option>
                                    <option value="false">旧品</option>
                                </select>
                            </div>
                        </div>
                        <div class="search-actions">
                            <button onclick="handleAdvancedSearch()" class="btn-search">搜索</button>
                            <button onclick="resetSearchFilters()" class="btn-reset">重置</button>
                        </div>
                    </div>
                    <div class="search-results" id="search-results"></div>
                </div>
                
                <div id="settings-tab" class="tab-content settings-tab">
                    <h2>系统设置</h2>
                    
                    <div class="settings-group">
                        <h3>数据管理</h3>
                        <div class="settings-buttons">
                            <button onclick="initializeDatabase()" class="btn-settings" style="background-color: #4CAF50; color: white;">初始化数据库</button>
                            <button onclick="backupData()" class="btn-settings" style="background-color: #2196F3; color: white;">数据备份</button>
                            <button onclick="restoreData()" class="btn-settings" style="background-color: #FF9800; color: white;">数据恢复</button>
                            <button onclick="syncData()" class="btn-settings" style="background-color: #9C27B0; color: white;">数据同步</button>
                        </div>
                        <div class="settings-buttons" style="margin-top: 8px;">
                            <button onclick="updateRB()" class="btn-settings" style="background-color: #00BCD4; color: white; flex: 1;">更新RB</button>
                            <button onclick="exportRB()" class="btn-settings" style="background-color: #4CAF50; color: white; flex: 1;">导出RB</button>
                        </div>
                        <div id="rb-status-hint" style="font-size: 12px; margin-top: 8px; text-align: center;"></div>
                    </div>
                    
                    <div class="settings-group">
                        <h3>缓存管理</h3>
                        <div class="settings-buttons">
                            <button onclick="clearCache()" class="btn-settings" style="background-color: #f44336; color: white;">清除本地缓存</button>
                            <button onclick="reloadApp()" class="btn-settings" style="background-color: #795548; color: white;">重启应用</button>
                        </div>
                    </div>
                    
                    <div class="settings-group">
                        <h3>统计信息</h3>
                        <div class="stats-grid" id="stats-grid">
                            <div class="stat-item">
                                <div class="stat-value" id="stat-repos">--</div>
                                <div class="stat-label">仓库数</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="stat-boxes">--</div>
                                <div class="stat-label">盒子数</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="stat-parts">--</div>
                                <div class="stat-label">零件种类</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="stat-total-qty">--</div>
                                <div class="stat-label">零件总数</div>
                            </div>
                        </div>
                        <button onclick="loadStats()" class="btn-refresh-stats">刷新统计</button>
                    </div>
                    
                    <div class="settings-group">
                        <h3>关于系统</h3>
                        <div class="about-info">
                            <p>版本: 3.0.0 (Supabase版)</p>
                            <p>数据库: Supabase PostgreSQL</p>
                            <p>静态资源: GitHub Pages + Gitee</p>
                            <p>开发者: LEGOPing</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 使用版本号参数强制浏览器安装新SW，绕过旧SW的缓存锁
                navigator.serviceWorker.register('service-worker.js?v=v56', { updateViaCache: 'none' })
                    .then(registration => {
                        console.log('Service Worker注册成功:', registration);
                        // 如果有旧SW在控制页面，强制重新加载以应用新版本
                        if (navigator.serviceWorker.controller) {
                            console.log('检测到旧SW控制，等待新版本激活...');
                            navigator.serviceWorker.addEventListener('controllerchange', () => {
                                window.location.reload();
                            });
                        }
                    })
                    .catch(error => {
                        console.log('Service Worker注册失败:', error);
                    });
            });
        }

        window.onerror = function(message, source, lineno, colno, error) {
            console.error('全局错误:', message, '文件:', source, '行:', lineno);
            // 如果检测到RB_STORES缺失（旧SW缓存问题），强制刷新
            if (message && message.includes('RB_STORES')) {
                console.warn('检测到RB_STORES缺失，尝试硬刷新...');
                setTimeout(() => {
                    // 清除所有缓存后刷新
                    if ('caches' in window) {
                        caches.keys().then(keys => {
                            keys.forEach(key => caches.delete(key));
                            window.location.href = window.location.pathname + '?v=' + Date.now();
                        });
                    } else {
                        window.location.href = window.location.pathname + '?v=' + Date.now();
                    }
                }, 500);
            }
            return true;
        };

        window.addEventListener('unhandledrejection', function(event) {
            console.error('未处理的Promise拒绝:', event.reason);
            event.preventDefault();
        });
        
        window.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
